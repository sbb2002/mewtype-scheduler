<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UFO 조작 패널</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07060f}
.tile{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;box-sizing:border-box;background:rgba(18,16,40,.55);border:1px solid rgba(120,200,255,.22);color:#eef6ff;text-align:left;font:inherit;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
.tile:hover{background:rgba(30,26,64,.7)}
.tile.is-on{background:rgba(255,95,170,.14);border-color:#ff6fb5;box-shadow:inset 0 0 18px rgba(255,111,181,.18)}
.tile:focus-visible{outline:2px solid #4fe3ff;outline-offset:2px}
.ico{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(79,227,255,.35);color:#4fe3ff}
.tile.is-on .ico{border-color:#ff6fb5}
.lbl{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12px;color:#a9bad0;line-height:1.35;margin-top:2px}
.led{width:8px;height:8px;border:1px solid #5c6b85}
.tile.is-on .led{background:#ff6fb5;border-color:#ff6fb5;box-shadow:0 0 8px #ff6fb5}
.mono{font-family:'Chakra Petch',monospace}
.tile{position:relative}
.tile > span:not(.fill){position:relative}
/* 길게 누르기 충전 — 왼쪽에서 오른쪽으로 차오름(밝은 앞머리) */
.fill{position:absolute;inset:0;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,111,181,.06),rgba(255,111,181,.34) calc(100% - 3px),#ffb3da calc(100% - 3px));pointer-events:none}
.fill.full{background:rgba(255,111,181,.22);animation:fullPulse 1.4s ease-in-out infinite}
@keyframes fullPulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.fill.full{animation:none}}
.chip{font-family:'Chakra Petch',monospace;font-size:10px;letter-spacing:.06em;color:#4fe3ff;border:1px solid rgba(79,227,255,.4);padding:1px 5px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Noto Sans KR',system-ui,sans-serif;color:#eef6ff;background:#07060f">

  <!-- 배경(선택에 따라 바뀜) — 실제 구현에선 WebGL 돔이 그린다. 레드존 떨림은 배경 전체를 흔든다 -->
  <div style="position:absolute;inset:-8px;transform:translate({{sx}}px,{{sy}}px)">
  <sc-if value="{{isPink}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#f6b6d6 0%,#f9cde2 45%,#e7a6cf 70%,#3b2a5e 70.2%,#241a3f 100%)"></div>
  </sc-if>
  <sc-if value="{{isSpace}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:#05040c">
      <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0">
        <g fill="#dfe9ff">
          <circle cx="34" cy="90" r="1"></circle><circle cx="120" cy="40" r="1.4"></circle><circle cx="300" cy="70" r="1"></circle><circle cx="352" cy="180" r="1.2"></circle><circle cx="64" cy="230" r="1.1"></circle><circle cx="210" cy="140" r="0.8"></circle><circle cx="268" cy="300" r="1"></circle><circle cx="22" cy="400" r="1.3"></circle><circle cx="370" cy="420" r="0.9"></circle><circle cx="90" cy="560" r="1"></circle><circle cx="330" cy="610" r="1.4"></circle><circle cx="180" cy="700" r="1"></circle><circle cx="40" cy="760" r="0.9"></circle><circle cx="260" cy="790" r="1.2"></circle>
        </g>
      </svg>
      <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0;opacity:{{streakOpacity}}">
        <g stroke="#bfe6ff" stroke-width="1.4" stroke-linecap="round">
          <line x1="195" y1="422" x2="20" y2="60"></line><line x1="195" y1="422" x2="380" y2="40"></line><line x1="195" y1="422" x2="0" y2="300"></line><line x1="195" y1="422" x2="390" y2="260"></line><line x1="195" y1="422" x2="10" y2="620"></line><line x1="195" y1="422" x2="385" y2="700"></line><line x1="195" y1="422" x2="120" y2="844"></line><line x1="195" y1="422" x2="300" y2="844"></line><line x1="195" y1="422" x2="150" y2="0"></line><line x1="195" y1="422" x2="250" y2="0"></line>
        </g>
      </svg>
    </div>
  </sc-if>
  <sc-if value="{{isEarth}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#0f1a3a 0%,#26407a 50%,#6a7fae 64%,#22291f 64.2%,#141a13 100%)">
      <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0">
        <g fill="#e9efff"><circle cx="40" cy="80" r="1.2"></circle><circle cx="140" cy="50" r="1"></circle><circle cx="250" cy="110" r="1.3"></circle><circle cx="350" cy="60" r="1"></circle><circle cx="90" cy="180" r="0.9"></circle><circle cx="300" cy="200" r="1.1"></circle><circle cx="200" cy="260" r="0.8"></circle></g>
        <circle cx="318" cy="150" r="13" fill="#f4ecd2"></circle>
      </svg>
    </div>
  </sc-if>

  <!-- 돔 유리 격자 -->
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0">
    <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1">
      <path d="M-40 250 Q195 150 430 250"></path><path d="M-40 420 Q195 340 430 420"></path>
      <path d="M195 0 L195 590"></path><path d="M60 0 Q90 300 30 590"></path><path d="M330 0 Q300 300 360 590"></path>
    </g>
  </svg>
  </div>

  <!-- 조작 패널(화면 가운데 고정 — 기어 패널이 뜨면 위로 비켜 선다) -->
  <div style="position:absolute;left:24px;right:24px;top:{{panelTop}}px;transition:top .35s ease;padding:16px;background:rgba(10,8,26,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(79,227,255,.55);box-shadow:0 0 0 1px rgba(255,111,181,.15),0 0 32px rgba(79,227,255,.18);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));display:flex;flex-direction:column;gap:12px">
    <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="mono" style="font-size:11px;font-weight:600;letter-spacing:.18em;color:#4fe3ff">UFO CONTROL</span>
        <span style="font-size:17px;font-weight:700">어디로 갈까요?</span>
      </div>
      <span class="mono" style="font-size:11px;letter-spacing:.08em;color:#ff8cc6;border:1px solid rgba(255,111,181,.5);padding:3px 7px">r 0.06</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button type="button" class="tile {{pinkCls}}" onClick="{{pickPink}}" aria-pressed="{{isPink}}">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="#ff8cc6" stroke="#ff6fb5" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 17.5h11a3.5 3.5 0 0 0 .4-7A5 5 0 0 0 8.3 9.4 4 4 0 0 0 6.5 17.5Z"></path></svg></span>
        <span><span class="lbl" style="display:block">버츄얼 스페이스</span><span class="sub" style="display:block">편안히 붕~ 떠있는 공간.</span></span>
        <span class="led"></span>
      </button>

      <button type="button" class="tile {{spaceCls}}" onPointerDown="{{holdStart}}" onPointerUp="{{holdEnd}}" onPointerCancel="{{holdEnd}}" onPointerLeave="{{holdEnd}}" onContextMenu="{{noMenu}}" aria-pressed="{{isSpace}}">
        <span class="fill {{fillCls}}" style="transform:scaleX({{charge}})"></span>
        <span class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-linecap="round" aria-hidden="true">
          <ellipse cx="12" cy="12" rx="10.5" ry="3.4" transform="rotate(-18 12 12)" stroke="#e8c58a" stroke-width="1.5"></ellipse>
          <circle cx="12" cy="12" r="5.6" fill="#d9a85e" stroke="#f3d39b" stroke-width="1"></circle>
          <path d="M7 12.6c3 .9 7 .7 10-.8" stroke="#b9843f" stroke-width="1"></path>
          <path d="M2.3 15.1C5 15.6 10 14.6 15 12.9s7-3.4 6.7-4.6" stroke="#e8c58a" stroke-width="1.5"></path>
        </svg></span>
        <span><span class="lbl" style="display:block">초행성X로의 여행</span><span class="sub" style="display:block">{{spaceSub}}</span><span style="display:flex;gap:4px;margin-top:5px"><span class="chip">{{chipText}}</span></span></span>
        <span class="led"></span>
      </button>

      <button type="button" class="tile {{earthCls}}" onClick="{{pickEarth}}" aria-pressed="{{isEarth}}">
        <span class="ico"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="#2a6fd1"></circle>
          <path d="M7.2 5.6c1.6-.6 3.1-.3 3.6.8.4 1-.9 1.4-.7 2.5.2 1 1.6 1 1.5 2.3-.1 1.2-1.6 1.2-2.3 2.4-.6 1-.1 2.6-1 3-.9.3-1.6-1-2-2.4-.4-1.5-1.6-2-1.8-3.4-.2-1.6.9-4.4 2.7-5.2Z" fill="#5fd08a"></path>
          <path d="M14.4 4.4c1.5.2 3.4 1.4 4.4 3-.9.3-1.8-.3-2.6.3-.8.6-.2 1.8-1.2 2.1-1 .3-1.6-.8-1.4-2 .2-1.3-.6-2.5.8-3.4Z" fill="#5fd08a"></path>
          <path d="M15.6 13.4c1.2-.4 2.9.2 3.2 1.4-.5 1.6-1.6 3-3 3.9-.6-.9.5-1.8 0-2.8-.4-.9-1.2-1.8-.2-2.5Z" fill="#5fd08a"></path>
          <circle cx="12" cy="12" r="9" fill="none" stroke="#9fd6ff" stroke-width="1"></circle>
        </svg></span>
        <span><span class="lbl" style="display:block">지구</span><span class="sub" style="display:block">당신이 있는 곳일지도?</span><span style="display:flex;gap:4px;margin-top:5px"><span class="chip">해</span><span class="chip">달</span><span class="chip">별</span><span class="chip">실제 자리</span></span></span>
        <span class="led"></span>
      </button>
      <sc-if value="{{isEarth}}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;padding:0 4px;font-size:12px;color:#ffd27a;line-height:1.4">위치 권한을 물어요 — 거절하면 지금 배경에 남아요.</p>
      </sc-if>
    </div>

    <div class="mono" style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:#7f90a8;border-top:1px solid rgba(79,227,255,.18);padding-top:8px">
      <span>오므리면 닫힘</span><span>SYS · OK</span>
    </div>
  </div>

  <!-- 워프 기어 패널(성간 이동 중에만) -->
  <sc-if value="{{warp}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:24px;top:448px">
      <dc-import name="Gear" start-gear="{{one}}" on-beta="{{onBeta}}" on-stop="{{onStop}}" hint-size="342px,380px"></dc-import>
    </div>
  </sc-if>

  <!-- 화면 가장자리 HUD 모서리 -->
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
    <g fill="none" stroke="#4fe3ff" stroke-opacity=".6" stroke-width="2">
      <path d="M14 44V14h30"></path><path d="M376 44V14h-30"></path><path d="M14 800v30h30"></path><path d="M376 800v30h-30"></path>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // 속도 · 떨림은 기어 패널(Gear.dc.html)이 계산해 onBeta 로 알려 준다
  // 초행성X 길게 누르기: 1초 동안 왼쪽 → 오른쪽으로 차오르고 100% 면 성간 이동 발동. 중간에 떼면 0.25초 만에 빠진다
  constructor(p) { super(p); this.state = { sel: 'pink', warp: false, beta: 0, sx: 0, sy: 0, charge: 0, holding: false }; this.chT = null; this.chLast = 0; }
  componentWillUnmount() { clearInterval(this.chT); }
  chargeLoop() {
    if (this.chT) return;
    this.chLast = Date.now();
    this.chT = setInterval(() => {
      const now = Date.now(), dt = (now - this.chLast) / 1000; this.chLast = now;
      const s = this.state;
      if (s.warp) { clearInterval(this.chT); this.chT = null; return; }
      let c = s.holding ? s.charge + dt / 1.0 : s.charge - dt / 0.25;
      if (c >= 1) { clearInterval(this.chT); this.chT = null; this.setState({ charge: 1, warp: true, holding: false }); return; }
      if (c <= 0) { c = 0; if (!s.holding) { clearInterval(this.chT); this.chT = null; } }
      this.setState({ charge: c });
    }, 30);
  }
  renderVals() {
    const { sel, warp, beta, sx, sy, charge } = this.state;
    const reset = { warp: false, beta: 0, sx: 0, sy: 0, charge: 0, holding: false };
    return {
      isPink: sel === 'pink', isSpace: sel === 'space', isEarth: sel === 'earth', warp, one: 1,
      charge: charge.toFixed(3), fillCls: warp ? 'full' : '',
      spaceSub: warp ? '메롱이다, 그럼 바이바이!' : '외우주로 가출하고 오겠습니다!',
      chipText: warp ? '성간 이동 중' : charge > 0 ? '충전 ' + Math.round(charge * 100) + '%' : '길게 누르면 워프',
      sx: Number(sx).toFixed(1), sy: Number(sy).toFixed(1),
      onBeta: (b, x, y) => this.setState({ beta: b, sx: x, sy: y }),
      onStop: () => this.setState(reset),
      pinkCls: sel === 'pink' ? 'is-on' : '', spaceCls: sel === 'space' ? 'is-on' : '', earthCls: sel === 'earth' ? 'is-on' : '',
      pickPink: () => this.setState({ sel: 'pink', ...reset }),
      pickEarth: () => this.setState({ sel: 'earth', ...reset }),
      holdStart: () => {
        if (sel !== 'space') this.setState({ sel: 'space', ...reset });
        if (this.state.warp) return;
        this.setState({ holding: true }); this.chargeLoop();
      },
      holdEnd: () => { if (this.state.holding) { this.setState({ holding: false }); this.chargeLoop(); } },
      noMenu: (e) => e.preventDefault(),
      streakOpacity: (beta * 0.9).toFixed(2),
      panelTop: warp ? 40 : 230,
    };
  }
}
</script>
</body>
</html>
