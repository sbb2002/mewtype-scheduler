<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>워프 점프 시안</title>
<style>
  :root { --cyan:#4fe3ff; --pink:#ff6fb5; --red:#ff3d5a; --ink:#eef6ff; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); font-family:"Noto Sans KR",system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .top { position:fixed; left:12px; right:12px; top:calc(env(safe-area-inset-top,0px) + 10px); font-size:12px; line-height:1.45; text-shadow:0 0 6px #000; pointer-events:none; }
  .top b { color:var(--cyan); font-size:15px; display:block; margin-bottom:2px; }
  .top .st { font-family:ui-monospace,Menlo,monospace; letter-spacing:.1em; color:#ff8a9c; margin-top:4px; }
  .dock { position:fixed; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); display:flex; flex-direction:column; gap:8px; }
  .gear { display:flex; align-items:center; gap:10px; padding:10px 12px; background:rgba(10,8,26,.72); border:1px solid rgba(255,61,90,.7); box-shadow:0 0 18px rgba(255,61,90,.35); clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); transition:border-color .3s, box-shadow .3s; }
  .gear.calm { border-color:rgba(79,227,255,.55); box-shadow:0 0 18px rgba(79,227,255,.2); }
  .gear .rd { font-family:ui-monospace,Menlo,monospace; font-size:12px; letter-spacing:.12em; color:#ff8a9c; flex:1; }
  .gear.calm .rd { color:#bfefff; }
  .warp { font:700 14px ui-monospace,Menlo,monospace; letter-spacing:.2em; color:#fff; background:rgba(255,61,90,.25); border:1px solid var(--red); padding:10px 16px; box-shadow:0 0 14px rgba(255,61,90,.5); }
  .warp:disabled { opacity:.35; box-shadow:none; }
  .pick { display:flex; gap:6px; }
  .pick button, .opt button { flex:1; font:600 13px "Noto Sans KR",system-ui,sans-serif; color:var(--ink); background:rgba(18,16,40,.75); border:1px solid rgba(120,200,255,.3); padding:9px 4px; }
  .pick button.on { border-color:var(--cyan); background:rgba(79,227,255,.16); }
  .opt { display:flex; gap:6px; }
  .opt button.on { border-color:var(--pink); background:rgba(255,111,181,.16); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><b id="ttl"></b><span id="desc"></span><div class="st" id="st"></div></div>
<div class="dock">
  <div class="gear" id="gear"><span class="rd" id="rd">GEAR 5 · 0.99c · REDZONE</span><button class="warp" id="warp" type="button">WARP</button></div>
  <div class="pick" id="pick"></div>
  <div class="opt"><button id="slow" type="button">느리게 ×4</button><button id="cmp" type="button">자동 반복</button></div>
</div>
<script>
// 워프 점프 시안 — 실제 셰이더가 아니라 2D 캔버스 흉내(모양 · 타이밍 비교용). 레드존(0.99c) 별 줄무늬에서 WARP 를 누르면 → 점프 연출 → 감속(0.99c → 0, 옛 「도착」) → 일반 우주.
const V = {
  A: { name: "A · 섬광 돌파", desc: "줄무늬가 길게 늘어나며 한가운데로 빨려 들어갔다가, 하얀 섬광과 시안 · 분홍 충격 고리가 터지며 빠져나온다. 가장 「점프」다운 한 방.", T: 3900 },
  B: { name: "B · 홀로그램 재투영 점프", desc: "줄무늬가 홀로그램처럼 멈칫(색 갈라짐)하고, 가운데서 흰 고리가 퍼지며 바깥은 도트로 부서지고 안쪽은 이미 도착한 일반 우주. 하늘 전환(돔 재투영)과 같은 말투.", T: 3600 },
  C: { name: "C · 터널 급제동", desc: "줄무늬가 시안 · 분홍 고리 터널로 감기다가, 붉은 충격파와 함께 급제동. 레드존의 긴장을 이어 받는 「브레이크」 느낌.", T: 3800 },
};
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, F = 0;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); cx = W / 2; cy = H * 0.42; F = W * 0.9; }
addEventListener("resize", resize); resize();

const N = 520, stars = [];
const rnd = (a, b) => a + Math.random() * (b - a);
function spawn(s, far) { s.x = rnd(-1.6, 1.6); s.y = rnd(-1.6, 1.6); s.z = far ? 1 : rnd(0.05, 1); s.b = rnd(.45, 1); s.hue = Math.random() < .15 ? 1 : 0; return s; }
for (let i = 0; i < N; i++) stars.push(spawn({}, false));
const speedOf = (beta) => 0.03 + 2.6 * beta * beta;   // z 단위 / 초

// 도트용 고정 무작위 문턱(칸 6px)
const CELL = 6; const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

let variant = "A", slow = 1, loop = false, phase = "warp", t0 = 0, beta = 0.99, frozen = null;
const off = document.createElement("canvas"), og = off.getContext("2d");
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const clamp01 = (x) => Math.max(0, Math.min(1, x));

function drawBg(ctx, red) {
  const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * .7);
  gr.addColorStop(0, "#0d0a1e"); gr.addColorStop(.6, "#07061a"); gr.addColorStop(1, red ? "#1a0610" : "#04030b");
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
}
// 별 그리기 — trail = 줄무늬 길이 배율, pull = 가운데로 빨려 듦(0~1), tint = 레드존 붉은빛
function drawStars(ctx, b, trail, pull = 0, tint = 0, alpha = 1) {
  const sp = speedOf(b);
  ctx.lineCap = "round";
  for (const s of stars) {
    const z1 = s.z, z0 = Math.min(1.2, s.z + Math.max(0.004, sp * 0.05 * trail));
    let x1 = cx + s.x / z1 * F * .25, y1 = cy + s.y / z1 * F * .25;
    let x0 = cx + s.x / z0 * F * .25, y0 = cy + s.y / z0 * F * .25;
    if (pull) { x1 = cx + (x1 - cx) * (1 - pull); y1 = cy + (y1 - cy) * (1 - pull); x0 = cx + (x0 - cx) * (1 - pull * .7); y0 = cy + (y0 - cy) * (1 - pull * .7); }
    const near = 1 - z1, a = Math.min(1, s.b * (0.35 + near)) * alpha;
    const w = 0.6 + near * 1.8;
    if (Math.hypot(x1 - x0, y1 - y0) < 1.2) { ctx.fillStyle = `rgba(235,245,255,${a})`; ctx.fillRect(x1 - w / 2, y1 - w / 2, w, w); continue; }
    const gr = ctx.createLinearGradient(x0, y0, x1, y1);
    const head = s.hue ? `rgba(255,190,225,${a})` : `rgba(240,250,255,${a})`;
    const tail = tint > 0 ? `rgba(255,${80 + 120 * (1 - tint)},${120 + 100 * (1 - tint)},0)` : "rgba(79,227,255,0)";
    gr.addColorStop(0, tail); gr.addColorStop(1, head);
    ctx.strokeStyle = gr; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
}
function step(dt, b) {
  const sp = speedOf(b);
  for (const s of stars) { s.z -= sp * dt; if (s.z < 0.03 || Math.abs(s.x / s.z) > 6 || Math.abs(s.y / s.z) > 6) spawn(s, true); }
}
function ring(ctx, r, color, width, alpha, blur) {
  if (r <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
const maxR = () => Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 40;
const decelBeta = (u) => 0.99 * (1 - ease(u)) * Math.exp(-2.2 * u);   // 감속(옛 「도착」 흉내)

function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  const dt = dtReal / slow;
  const el = phase === "jump" ? (now - t0) / slow : 0;
  const v = V[variant];
  let status = "";
  g.globalAlpha = 1;

  if (phase === "warp") {
    beta = 0.99; step(dt, beta); drawBg(g, true); drawStars(g, beta, 1, 0, 1);
    status = "0.99c · REDZONE — WARP 를 누르세요";
  } else if (phase === "rest") {
    beta = 0; step(dt, 0.02); drawBg(g, false); drawStars(g, 0.02, 1);
    status = "일반 우주 · 0.00c";
    if (loop && now - t0 > 1600 * slow) toWarp();
  } else if (variant === "A") {
    // 0~450 늘어남 · 450~620 빨려 듦 · 620 섬광 + 충격 고리 · 이후 감속
    const u1 = ease(el / 450), u2 = ease((el - 450) / 170), after = el - 620;
    if (after < 0) {
      step(dt, 0.99); drawBg(g, true);
      drawStars(g, 0.99, 1 + 4 * u1, 0.92 * u2, 1, 1);
      g.fillStyle = `rgba(200,240,255,${0.5 * u2})`; g.fillRect(0, 0, W, H);
      status = el < 450 ? "STRETCH" : "COLLAPSE";
    } else {
      const u = clamp01(after / (v.T - 620)); beta = decelBeta(u); step(dt, beta);
      drawBg(g, false); drawStars(g, beta, 1, 0, Math.max(0, 1 - u * 3));
      const R = maxR(), k = clamp01(after / 520);
      ring(g, R * ease(k), "#4fe3ff", 10 * (1 - k) + 2, 1 - k, 24);
      ring(g, R * ease(k) - 18, "#ff6fb5", 6 * (1 - k) + 1, (1 - k) * .9, 18);
      g.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - after / 380)})`; g.fillRect(0, 0, W, H);
      status = `JUMP → DECEL ${beta.toFixed(2)}c`;
    }
    if (el >= v.T) toRest(now);
  } else if (variant === "B") {
    // 0~320 멈칫(색 갈라짐) · 320~1700 흰 고리가 퍼짐(바깥 도트 · 안쪽 일반 우주) · 이후 감속
    if (!frozen) { off.width = cv.width; off.height = cv.height; og.setTransform(DPR, 0, 0, DPR, 0, 0); drawBg(og, true); drawStars(og, 0.99, 1, 0, 1); frozen = true; }
    if (el < 320) {
      const j = (Math.random() - .5) * 6;
      g.drawImage(off, 0, 0, W, H);
      g.globalCompositeOperation = "lighter"; g.globalAlpha = .35;
      g.drawImage(off, j, 0, W, H); g.filter = "none";
      g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
      g.fillStyle = "rgba(79,227,255,.10)"; for (let y = (now / 6) % 4; y < H; y += 4) g.fillRect(0, y, W, 1);
      status = "HOLD — 투영 고정";
    } else {
      const u = clamp01((el - 320) / (v.T - 320)); beta = decelBeta(clamp01((el - 320) / 2000)) * 0.75; step(dt, beta);
      const R = maxR() * ease(clamp01((el - 320) / 1380)), band = 46;
      // 새 우주(안쪽)
      drawBg(g, false); drawStars(g, beta, 1);
      // 바깥 = 얼어붙은 레드존 화면, 단 띠(R ~ R+band)는 도트로 서서히 사라짐
      g.save(); g.beginPath(); g.rect(0, 0, W, H); g.arc(cx, cy, R + band, 0, Math.PI * 2, true); g.clip("evenodd"); g.drawImage(off, 0, 0, W, H); g.restore();
      if (R < maxR()) {
        const r0 = Math.max(0, R), r1 = R + band;
        const x0 = Math.max(0, Math.floor((cx - r1) / CELL)), x1 = Math.min(Math.ceil(W / CELL), Math.ceil((cx + r1) / CELL));
        const y0 = Math.max(0, Math.floor((cy - r1) / CELL)), y1 = Math.min(Math.ceil(H / CELL), Math.ceil((cy + r1) / CELL));
        for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) {
          const px = xx * CELL + CELL / 2, py = yy * CELL + CELL / 2, d = Math.hypot(px - cx, py - cy);
          if (d < r0 || d > r1) continue;
          const s = (r1 - d) / band, th = .01 + .64 * hash(xx, yy), rev = ease(clamp01((s - th) / .35));
          if (rev >= 1) continue;
          g.globalAlpha = 1 - rev; g.drawImage(off, xx * CELL * DPR, yy * CELL * DPR, CELL * DPR, CELL * DPR, xx * CELL, yy * CELL, CELL, CELL);
        }
        g.globalAlpha = 1;
        // 흰 선 = 여기까지 완료(띠의 안쪽 끝)
        ring(g, R, "#4fe3ff", 26, .55, 30);
        ring(g, R, "#fffaf0", 14, .95, 10);
      }
      // 분홍 잔광
      ring(g, Math.max(0, R - 30), "#ff6fb5", 8, .35 * (1 - u), 20);
      status = `REPROJECT → DECEL ${beta.toFixed(2)}c`;
    }
    if (el >= v.T) toRest(now);
  } else {
    // C: 0~700 터널 · 700~860 붉은 충격파 · 이후 감속
    const R = maxR();
    if (el < 700) {
      const k = el / 700; step(dt, 0.99); drawBg(g, true);
      drawStars(g, 0.99, 1 + 2 * k, 0, 1, 1 - k * .8);
      for (let i = 0; i < 9; i++) {
        const ph = ((now / slow) / 520 + i / 9) % 1, r = ph * ph * R;
        ring(g, r, i % 2 ? "#ff6fb5" : "#4fe3ff", 1 + 5 * ph, ease(k) * (1 - ph) * .9, 12);
      }
      status = "TUNNEL";
    } else {
      const after = el - 700, u = clamp01(after / (V.C.T - 700)); beta = decelBeta(u); step(dt, beta);
      drawBg(g, false); drawStars(g, beta, 1, 0, Math.max(0, 1 - u * 2));
      const k = clamp01(after / 420);
      ring(g, R * ease(k), "#ff3d5a", 22 * (1 - k) + 2, 1 - k, 36);
      ring(g, R * ease(k) * .82, "#ffd27a", 4, (1 - k) * .7, 14);
      g.fillStyle = `rgba(255,40,70,${Math.max(0, .45 - after / 500)})`; g.fillRect(0, 0, W, H);
      status = `BRAKE → DECEL ${beta.toFixed(2)}c`;
    }
    if (el >= v.T) toRest(now);
  }
  document.getElementById("st").textContent = status;
}
function toRest(now) { phase = "rest"; t0 = now; frozen = null; document.getElementById("gear").classList.add("calm"); document.getElementById("rd").textContent = "GEAR N · 0.00c"; document.getElementById("warp").disabled = true; }
function toWarp() { phase = "warp"; frozen = null; document.getElementById("gear").classList.remove("calm"); document.getElementById("rd").textContent = "GEAR 5 · 0.99c · REDZONE"; document.getElementById("warp").disabled = false; for (const s of stars) spawn(s, false); if (loop) setTimeout(() => phase === "warp" && jump(), 1800 * slow); }
function jump() { if (phase !== "warp") return; phase = "jump"; t0 = performance.now(); document.getElementById("warp").disabled = true; if (navigator.vibrate) try { navigator.vibrate([10, 40, 30]); } catch {} }
function pick(k) { variant = k; for (const b of document.querySelectorAll("#pick button")) b.classList.toggle("on", b.dataset.k === k); document.getElementById("ttl").textContent = V[k].name; document.getElementById("desc").textContent = V[k].desc; toWarp(); }
for (const k of Object.keys(V)) { const b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.textContent = k; b.addEventListener("click", () => pick(k)); document.getElementById("pick").append(b); }
document.getElementById("warp").addEventListener("click", jump);
document.getElementById("slow").addEventListener("click", (e) => { slow = slow === 1 ? 4 : 1; e.currentTarget.classList.toggle("on", slow > 1); });
document.getElementById("cmp").addEventListener("click", (e) => { loop = !loop; e.currentTarget.classList.toggle("on", loop); if (loop && phase !== "jump") toWarp(); });
pick("A");
requestAnimationFrame(frame);
</script>
</body>
</html>
