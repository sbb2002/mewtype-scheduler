// Lifecycle: no RAF while hidden, paused, reduced-motion or background off. Time never catches up.
function stopped(){return manualPause||mq.matches||off||document.hidden}
function clearParticles(){parts=[];ctx.clearRect(0,0,canvas.width,canvas.height)}
function sync(){const stop=stopped();stage.classList.toggle('still',stop);stage.classList.toggle('hidden-tab',document.hidden);stage.classList.toggle('is-off',off);$('#pause').setAttribute('aria-pressed',String(manualPause||mq.matches));$('#pause').textContent=manualPause?'움직임 재생':mq.matches?'모션 줄이기 적용':'움직임 멈춤';$('#pause').disabled=mq.matches;$('#burst').disabled=stop;$('#background').textContent=off?'배경 켜기':'배경 끄기';$('#background').setAttribute('aria-pressed',String(off));$('#motionStatus').textContent=mq.matches?'모션 줄이기 설정 적용':stop?'정지 장면':'느린 움직임 재생 중';if(stop){cancelAnimationFrame(raf);raf=0;last=0;clearParticles();}else if(!raf){last=0;raf=requestAnimationFrame(frame)}}
function viewport(){const narrow=matchMedia('(max-width:540px)').matches;svg.setAttribute('viewBox',narrow?'245 -300 850 1060':'0 0 1200 760');const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,innerWidth<600?1.5:2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);clearParticles()}
function choose(i,focus=false){current=(i+members.length)%members.length;const m=members[current];pointer={x:0,y:0,tx:0,ty:0};time=0;svg.innerHTML=defs()+m.draw();layers=[...svg.querySelectorAll('[data-depth]')];eq=[...svg.querySelectorAll('.equalizer')];floorLines=[...svg.querySelectorAll('.floor-line')];stage.style.setProperty('--scene-ink',m.ink);stage.setAttribute('aria-labelledby','tab-'+m.id);$('#chapter').textContent=m.kicker;$('#memberName').textContent=m.name;$('#birthday').textContent=m.date;$('#index').textContent=String(current+1).padStart(2,'0')+' / 05';$('#sceneLabel').textContent=m.label;$('#description').textContent=m.desc;document.querySelectorAll('[role=tab]').forEach((b,j)=>{b.setAttribute('aria-selected',String(j===current));b.tabIndex=j===current?0:-1});if(focus)$('#tab-'+m.id).focus({preventScroll:true});clearParticles();sync()}
$('#tabs').innerHTML=members.map((m,i)=>`<button type="button" role="tab" id="tab-${m.id}" aria-controls="stage" aria-selected="${!i}" tabindex="${i?-1:0}" style="--member:${m.color}">${m.name}</button>`).join('');
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[role=tab]');if(b)choose(members.findIndex(m=>'tab-'+m.id===b.id))});
$('#tabs').addEventListener('keydown',e=>{let n=current;if(e.key==='ArrowRight')n++;else if(e.key==='ArrowLeft')n--;else if(e.key==='Home')n=0;else if(e.key==='End')n=4;else return;e.preventDefault();choose(n,true)});
$('#pause').addEventListener('click',()=>{manualPause=!manualPause;sync()});$('#background').addEventListener('click',()=>{off=!off;sync()});$('#burst').addEventListener('click',celebrate);
stage.addEventListener('pointermove',e=>{if(stopped()||e.pointerType==='touch')return;const r=stage.getBoundingClientRect();pointer.tx=(e.clientX-r.left)/r.width-.5;pointer.ty=(e.clientY-r.top)/r.height-.5});stage.addEventListener('pointerleave',()=>{pointer.tx=pointer.ty=0});stage.addEventListener('click',e=>{if(stopped())return;const r=stage.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top)});
function burst(x,y){const cols=[members[current].color,C.white,C.gold];for(let i=0;i<40;i++){const a=i*Math.PI*2/40,v=28+Math.random()*50;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,color:cols[i%3],r:1+Math.random()*1.6,delay:0})}if(parts.length>120)parts.splice(0,parts.length-120)}
function celebrate(){if(stopped())return;const w=stage.clientWidth,h=stage.clientHeight;clearParticles();[[.24,.38],[.76,.27],[.54,.17]].forEach(([x,y],i)=>{const start=parts.length;burst(w*x,h*y);for(let n=start;n<parts.length;n++)parts[n].delay=i*.26})}
function frame(t){raf=0;if(stopped()){sync();return;}const dt=last?Math.min((t-last)/1000,.05):0;last=t;time+=dt;const ease=1-Math.exp(-dt*3);pointer.x+=(pointer.tx-pointer.x)*ease;pointer.y+=(pointer.ty-pointer.y)*ease;for(const l of layers){const d=+l.dataset.depth;l.setAttribute('transform',`translate(${(pointer.x*d*17).toFixed(2)} ${(pointer.y*d*8).toFixed(2)})`)}
 if(current===1){eq.forEach((b,i)=>{const h=30+70*(.5+.5*Math.sin(time*.8+i*.7))*(.65+.35*Math.sin(time*.31+i));b.setAttribute('height',h.toFixed(1));b.setAttribute('y',(405-h).toFixed(1))});floorLines.forEach((b,i)=>{const p=(i/13+time*.0035)%1,y=391+Math.pow(p,2.6)*420;b.setAttribute('y1',y.toFixed(2));b.setAttribute('y2',y.toFixed(2));b.setAttribute('stroke-opacity',(.12+p*.32).toFixed(2))})}
 if(parts.length){ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);for(const p of parts){p.age+=dt;if(p.age<p.delay)continue;const age=p.age-p.delay;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt;p.vx*=Math.exp(-dt*.35);ctx.globalAlpha=Math.max(0,1-age/2.1)*.85;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}parts=parts.filter(p=>p.age-p.delay<2.1);if(!parts.length)ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight)}raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',sync);mq.addEventListener('change',sync);window.addEventListener('resize',viewport);viewport();choose(0);
})();
