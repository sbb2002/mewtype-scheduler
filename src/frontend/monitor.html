<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>운영 모니터</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0e12; }
    #f { width: 100%; height: 100%; border: 0; display: block; }
    #msg { color: #8a8f98; font-family: -apple-system, "Segoe UI", sans-serif;
           padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <iframe id="f" title="운영 모니터 리포트" hidden></iframe>
  <p id="msg">불러오는 중…</p>
  <script>
    var LIVE_URL = "https://mewtype-telegram-lk3cg7l7ka-an.a.run.app/monitor-live";
    var SNAPSHOT_URL = "https://raw.githubusercontent.com/sbb2002/mewtype-scheduler-data/data/monitoring/latest.html";
    function load(url) {
      return fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      });
    }
    // 접속 시각 기준 리포트(가장 최근 06:00 KST~지금)를 우선, 서버가 죽었으면 마지막 스냅샷으로 폴백.
    function refresh() {
      return load(LIVE_URL)
        .catch(function () { return load(SNAPSHOT_URL); })
        .then(function (html) {
          var f = document.getElementById("f");
          f.srcdoc = html;
          f.hidden = false;
          document.getElementById("msg").hidden = true;
        });
    }
    refresh().catch(function () {
      document.getElementById("msg").textContent = "리포트를 불러올 수 없습니다.";
    });
    // (v3.8.7) "오늘의 멤버 현황"(트윗 건수·live 진행중 여부)이 실시간에 가깝게 보이도록
    // 탭이 보이는 동안 60초마다 전체를 다시 불러온다 — 실패해도 화면은 직전 값 그대로 유지.
    setInterval(function () {
      if (document.visibilityState === "visible") refresh().catch(function () {});
    }, 60000);
  </script>
</body>
</html>
