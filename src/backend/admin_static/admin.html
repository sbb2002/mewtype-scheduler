            },

            async deleteNotice(notice) {
                if (!confirm(`이 소식을 삭제할까요?\n\n${notice.date || ""} ${notice.title_ko || notice.title || ""}\n\n관리 페이지에는 되돌리기가 없습니다.`)) return;

                try {
                    const result = await this.apiCall("POST", "/delete_notice", { nid: notice.id });

                    if (result.ok) {
                        this.showToast("소식이 삭제되었습니다");
                        this.loadNoticesAndTweets();
                    } else {
                        this.showToast(result.error || "삭제 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            // (v4a) 트윗 1건만 지운다. (구: 유닛의 트윗 스레드 전체(최대 50건)가 지워졌다)
            async deleteTweet(unit, tweet) {
                const who = (this.channels[unit] || {}).name_ko || unit;
                const text = (tweet.text_ko || tweet.text || "").substring(0, 80);
                if (!confirm(`${who} 트윗 1건을 삭제할까요?\n\n${text}\n\n관리 페이지에는 되돌리기가 없습니다.`)) return;

                try {
                    const result = await this.apiCall("POST", "/delete_tweet", { unit, tweet_id: String(tweet.id) });

                    if (result.ok) {
                        this.showToast("트윗이 삭제되었습니다");
                        this.loadNoticesAndTweets();
                    } else {
                        this.showToast(result.error || "삭제 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            async translate(target, key) {
                try {
                    const result = await this.apiCall("POST", "/translate", { target, key });

                    if (result.ok) {
                        this.showToast("번역 작업이 적재되었습니다");
                        setTimeout(() => this.loadNoticesAndTweets(), 2000);
                    } else {
                        this.showToast(result.error || "번역 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            // ─────────────────────────────────────────────────────────────────────
            // 작업 탭
            // ─────────────────────────────────────────────────────────────────────

            async loadJobs() {
                try {
                    const data = await this.apiCall("GET", "/jobs_overview");
                    const hist = await this.apiCall("GET", "/list_history?limit=50");
                    this.jobs = data;
                    this.bindJobsControls();
                    this.renderNow(data.now || {});
                    this.renderFlows();
                    this.renderSched(data);
                    this.renderAuto();
                    this.renderPendingTl(data);
                    this.renderHistory(hist || []);
                    // 선택한 흐름이 갱신됐으면 상세도 갱신(재생 없이 현재 상태로)
                    const cur = (data.flows || []).find((f) => f.id === this.flowSel);
                    if (cur && JSON.stringify(cur) !== this.flowSelSnap) this.showFlow(cur, false);
                } catch (e) {
                    console.error("작업 로드 실패", e);
                }
            },

            bindJobsControls() {
                if (this.jobsBound) return;
                this.jobsBound = true;
                this.flowFilter = "all";
                this.autoFailOnly = false;
                document.querySelectorAll("#flow-chips .chip").forEach((c) => {
                    c.addEventListener("click", () => {
                        this.flowFilter = c.dataset.f;
                        document.querySelectorAll("#flow-chips .chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
                        this.renderFlows();
                    });
                });
                const setAuto = (fail) => {
                    this.autoFailOnly = fail;
                    document.getElementById("auto-all").setAttribute("aria-pressed", String(!fail));
                    document.getElementById("auto-fail").setAttribute("aria-pressed", String(fail));
                    this.renderAuto();
                };
                document.getElementById("auto-all").addEventListener("click", () => setAuto(false));
                document.getElementById("auto-fail").addEventListener("click", () => setAuto(true));
                document.getElementById("fd-replay").addEventListener("click", () => {
                    const f = ((this.jobs || {}).flows || []).find((x) => x.id === this.flowSel);
                    if (f) this.showFlow(f, true);
                });
            },

            // (v4a) 지금 상태 — 러너 · 텔레그램 · 마지막 알림(X · YouTube) · 적용 큐 · 방송 · 데이터 갱신
            renderNow(n) {
                const grid = document.getElementById("now-grid");
                grid.textContent = "";
                const nowMs = Date.parse(n.server_now || new Date().toISOString());
                const ago = (iso) => {
                    if (!iso) return "";
                    const m = Math.round((nowMs - Date.parse(iso)) / 60000);
                    if (m < 1) return "방금";
                    if (m < 60) return `${m}분 전`;
                    const h = Math.floor(m / 60);
                    return h < 24 ? `${h}시간 ${m % 60}분 전` : `${Math.floor(h / 24)}일 전`;
                };
                const tile = (label, val, sub, level) => {
                    const d = document.createElement("div");
                    d.className = "now-tile" + (level && level !== "ok" ? " " + level : "");
                    const a = document.createElement("div");
                    a.className = "lbl";
                    a.textContent = label;
                    const b = document.createElement("div");
                    b.className = "val";
                    b.textContent = val;
                    d.append(a, b);
                    if (sub) {
                        const c = document.createElement("div");
                        c.className = "sub";
                        c.textContent = sub;
                        d.appendChild(c);
                    }
                    grid.appendChild(d);
                };
                document.getElementById("now-at").textContent = `${this.formatTime(n.server_now)} 기준 · 5초마다 갱신`;

                const r = n.runner;
                tile("러너", r ? "가동 중" : "정보 없음",
                     r ? `${this.formatTime(r.started_at)}부터 (${ago(r.started_at)}) · ${r.bind}:${r.port}` : "runner.json 없음",
                     r ? "ok" : "warn");

                const tg = n.telegram || {};
                if (tg.state === "ok") {
                    tile("텔레그램 봇", "정상", `마지막 확인 ${this.formatTime(tg.last_ok)} (${ago(tg.last_ok)})`, "ok");
                } else if (tg.state === "error") {
                    tile("텔레그램 봇", `오류 ${tg.fails || 1}회째`,
                         `${tg.last_error || ""} · ${ago(tg.error_at)}` +
                         (String(tg.last_error || "").includes("409") ? " — 같은 봇을 다른 곳에서도 폴링 중" : ""), "bad");
                } else if (tg.state === "starting") {
                    tile("텔레그램 봇", "연결 중", "첫 응답 대기", "warn");
                } else {
                    tile("텔레그램 봇", "꺼짐", tg.reason || "", "warn");
                }

                for (const [key, label] of [["x", "마지막 X 알림"], ["yt", "마지막 YouTube 알림"]]) {
                    const u = (n.upstream || {})[key];
                    if (!u) {
                        tile(label, "오늘 없음", "어제 · 오늘 기록에 수신이 없습니다", "idle");
                    } else {
                        tile(label, `${this.formatTime(u.ts)} · ${ago(u.ts)}`, (u.ok ? "" : "✕ ") + (u.text || ""),
                             u.ok ? "ok" : "bad");
                    }
                }

                const q = n.queue || {};
                tile("적용 큐", q.due ? `지금 처리 대기 ${q.due}건` : "밀린 작업 없음",
                     `예약 ${q.scheduled || 0}건 · 번역 대기 ${q.enrich || 0}건`, q.due > 3 ? "warn" : "ok");

                const nx = (n.next || [])[0];
                if ((n.live || []).length) {
                    tile("방송", `라이브 ${n.live.length}건`, n.live.join(" / "), "ok");
                } else {
                    tile("방송", "라이브 없음", nx ? `다음 ${this.formatTime(nx.at)} · ${nx.what}` : "예정된 방송 없음", "idle");
                }

                tile("데이터 갱신", n.last_reconcile ? `${this.formatTime(n.last_reconcile)} · ${ago(n.last_reconcile)}` : "기록 없음",
                     `마지막 정기 수집 · 예고 파일 ${this.formatTime(n.preview_generated_at)}`,
                     n.last_reconcile && nowMs - Date.parse(n.last_reconcile) > 25 * 60000 ? "warn" : "ok");
            },

            flowStatus(f) {
                const cur = (f.stages || []).find((s) => ["fail", "run", "wait"].includes(s.s));
                const icon = { ok: "●", fail: "✕", run: "◐", wait: "◔" }[f.status] || "●";
                let text;
                if (f.status === "ok") text = `완료${f.total ? " " + f.total : ""}`;
                else if (f.status === "fail") text = `${cur ? cur.n + "에서 " : ""}멈춤`;
                else if (f.status === "wait") text = cur && cur.note ? cur.note : "대기 중";
                else text = `${cur ? cur.n : ""} 처리 중`;
                return { icon, text };
            },

            renderFlows() {
                const box = document.getElementById("flows");
                box.textContent = "";
                const flows = ((this.jobs || {}).flows || []).filter((f) =>
                    this.flowFilter === "all" || !this.flowFilter ? true
                        : this.flowFilter === "attn" ? f.status !== "ok" : f.cat === this.flowFilter);
                if (!flows.length) {
                    const e = document.createElement("div");
                    e.className = "jempty";
                    e.textContent = "기록된 흐름이 없습니다 — 알림이 들어오거나 관리 페이지에서 조작하면 여기 쌓입니다.";
                    box.appendChild(e);
                    return;
                }
                for (const f of flows.slice(0, 60)) {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "flow" + (f.id === this.flowSel ? " sel" : "");
                    const t = document.createElement("div");
                    t.className = "t";
                    t.textContent = this.formatTime(f.t0);
                    const what = document.createElement("div");
                    what.className = "what";
                    const k = document.createElement("div");
                    k.className = "k";
                    k.textContent = f.kind;
                    const d = document.createElement("div");
                    d.className = "d";
                    d.textContent = f.desc || "—";
                    what.append(k, d);
                    const { icon, text } = this.flowStatus(f);
                    const st = document.createElement("div");
                    st.className = "st s-" + f.status;
                    st.textContent = `${icon} ${text}`;
                    const bar = document.createElement("div");
                    bar.className = "fbar";
                    (f.stages || []).forEach((s, i) => {
                        if (i) {
                            const ln = document.createElement("b");
                            if (s.s !== "todo") ln.className = "done";
                            bar.appendChild(ln);
                        }
                        const dot = document.createElement("i");
                        if (s.s !== "todo") dot.className = s.s;
                        dot.title = `${s.n}${s.note ? " — " + s.note : ""}`;
                        bar.appendChild(dot);
                    });
                    const cur = (f.stages || []).find((s) => ["fail", "run", "wait"].includes(s.s));
                    const lbl = document.createElement("span");
                    lbl.className = "lbl";
                    lbl.textContent = cur ? `${cur.n} 단계` : `${(f.stages || []).filter((s) => s.s === "done").length}단계 거침`;
                    bar.appendChild(lbl);
                    b.append(t, what, st, bar);
                    b.addEventListener("click", () => {
                        this.flowSel = f.id;
                        this.renderFlows();
                        this.showFlow(f, true);
                    });
                    box.appendChild(b);
                }
            },

            // 경로 재생: 통과한 단계부터 차례로 켠다. 멈춘 · 진행 중 단계는 거기서 멈추고 사유를 보인다
            showFlow(f, animate) {
                (this.flowTimers || []).forEach(clearTimeout);
                this.flowTimers = [];
                this.flowSelSnap = JSON.stringify(f);
                document.getElementById("fdetail").hidden = false;
                document.getElementById("fd-ttl").textContent = f.kind;
                document.getElementById("fd-sub").textContent =
                    `${this.formatTime(f.t0)} · ${f.desc || ""}${f.total ? " · 전체 " + f.total : ""}`;
                const chain = document.getElementById("fd-chain");
                chain.textContent = "";
                const nodes = [], edges = [];
                (f.stages || []).forEach((s, i) => {
                    if (i) {
                        const e = document.createElement("div");
                        e.className = "fedge";
                        e.appendChild(document.createElement("span"));
                        chain.appendChild(e);
                        edges.push(e);
                    }
                    const n = document.createElement("div");
                    n.className = "fnode";
                    const nm = document.createElement("div");
                    nm.className = "n";
                    nm.textContent = s.n;
                    const x = document.createElement("div");
                    x.className = "x";
                    x.textContent = s.x || " ";
                    const note = document.createElement("div");
                    note.className = "note";
                    const ms = document.createElement("div");
                    ms.className = "ms";
                    n.append(nm, x, note, ms);
                    chain.appendChild(n);
                    nodes.push({ n, note, ms, s });
                });
                const r = document.getElementById("fd-reason");
                r.className = "freason" + (f.status === "ok" ? "" : " " + f.status);
                r.textContent = "";
                const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                const step = animate && !reduce ? 420 : 0;
                const upto = (() => {
                    let last = -1;
                    (f.stages || []).forEach((s, i) => { if (s.s !== "todo") last = i; });
                    return last + 1;
                })();
                const light = (i) => {
                    if (i && nodes[i].s.s !== "skip") edges[i - 1].classList.add("lit");
                    const { n, note, ms, s } = nodes[i];
                    n.classList.add("lit", s.s);
                    note.textContent = s.note || "";
                    ms.textContent = s.s === "skip" ? "해당 없음" : (s.ms || "");
                };
                const done = () => {
                    const cur = (f.stages || []).find((s) => ["fail", "run", "wait"].includes(s.s));
                    r.textContent = f.reason || (cur ? `${cur.n}: ${cur.note || cur.s}` : "");
                };
                if (!step) {
                    for (let i = 0; i < upto; i++) light(i);
                    done();
                    return;
                }
                for (let i = 0; i < upto; i++) this.flowTimers.push(setTimeout(() => light(i), step * i));
                this.flowTimers.push(setTimeout(done, step * upto));
            },

            renderSched(data) {
                const box = document.getElementById("jobs-sched");
                box.textContent = "";
                const row = (t, main, sub) => {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    const a = document.createElement("div");
                    a.className = "t";
                    a.textContent = t;
                    const b = document.createElement("div");
                    const m = document.createElement("div");
                    m.textContent = main;
                    const s2 = document.createElement("div");
                    s2.className = "m";
                    s2.textContent = sub;
                    b.append(m, s2);
                    r.append(a, b);
                    box.appendChild(r);
                };
                for (const j of data.scheduled || []) {
                    row(this.formatTime(j.run_at), j.what, j.why + (j.attempt > 1 ? ` · 재시도 ${j.attempt}회째` : ""));
                }
                const p = data.periodic || {};
                if (p.light) {
                    row("10분마다", "정기 수집 (전체 채널)",
                        `다음 ${this.formatTime(p.light).slice(6)} · 매일 06:00 JST 전체 확인 · 06:10 스냅샷`);
                }
                if (!box.children.length) row("—", "예정된 확인 없음", "");
            },

            renderAuto() {
                const box = document.getElementById("jobs-auto");
                box.textContent = "";
                const list = ((this.jobs || {}).auto || []).filter((a) => !this.autoFailOnly || !a.ok).slice(0, 30);
                if (!list.length) {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    r.textContent = this.autoFailOnly ? "실패한 작업이 없습니다" : "기록 없음";
                    box.appendChild(r);
                    return;
                }
                for (const a of list) {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    const t = document.createElement("div");
                    t.className = "t";
                    t.textContent = this.formatTime(a.ts);
                    const b = document.createElement("div");
                    if (!a.ok) b.className = "s-fail";
                    b.textContent = (a.ok ? "✓ " : "✕ ") + a.text;
                    r.append(t, b);
                    box.appendChild(r);
                }
            },

            renderPendingTl(data) {
                const box = document.getElementById("jobs-tl");
                box.textContent = "";
                const list = data.pending_tl || [];
                if (!list.length) {
                    const e = document.createElement("div");
                    e.className = "jempty";
                    e.textContent = "없음 — 새 제목이 들어오면 번역될 때까지 여기 보입니다.";
                    box.appendChild(e);
                    return;
                }
                const l = document.createElement("div");
                l.className = "jlist";
                for (const txt of list) {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    r.style.gridTemplateColumns = "1fr";
                    r.textContent = txt;
                    l.appendChild(r);
                }
                box.appendChild(l);
            },

            // 내가 한 조작: {id, ts, action, target, summary, ok, error, job_id} (admin_api.list_history)
            renderHistory(items) {
                const box = document.getElementById("jobs-history");
                box.textContent = "";
                const LABEL = {
                    edit_preview: "예고 수정", delete_preview: "예고 삭제", ingest_preview: "원문 투입 · 예고",
                    ingest_notice: "원문 투입 · 소식", ingest_tweet: "원문 투입 · 트윗", edit_notice: "소식 수정",
                    delete_notice: "소식 삭제", delete_tweet: "트윗 삭제", translate: "번역",
                    retry_lost: "유실 원문 재투입", set_paused: "일시정지 · 재개", set_log_level: "알림 레벨",
                    set_monitor_auto: "멤버 현황 DM",
                };
                if (!items.length) {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    r.textContent = "아직 없음";
                    box.appendChild(r);
                    return;
                }
                for (const h of items) {
                    const r = document.createElement("div");
                    r.className = "jrow";
                    const t = document.createElement("div");
                    t.className = "t";
                    t.textContent = this.formatTime(h.ts);
                    const b = document.createElement("div");
                    const m = document.createElement("div");
                    m.textContent = `${LABEL[h.action] || h.action}${h.summary ? " · " + h.summary : ""}`;
                    const s2 = document.createElement("div");
                    s2.className = "m" + (h.ok ? "" : " s-fail");
                    s2.textContent = h.ok ? "✓ 반영 · 되돌리기는 아직 없음" : `✕ ${h.error || "실패"}`;
                    b.append(m, s2);
                    r.append(t, b);
                    box.appendChild(r);
                }
            },

            // ─────────────────────────────────────────────────────────────────────
            // 유실 원문 탭
            // ─────────────────────────────────────────────────────────────────────

            async loadLost() {
                try {
                    const data = await this.apiCall("GET", "/list_lost");
                    this.renderLost(data);
                } catch (e) {
                    console.error("유실 원문 로드 실패", e);
                }
            },

            renderLost(data) {
                const container = document.getElementById("lost-list");
                container.classList.remove("loading");
                container.textContent = "";

                if (!Array.isArray(data) || data.length === 0) {
                    // (v4a) 빈 상태 — 이 탭이 무엇인지 설명
                    const box = document.createElement("div");
                    box.className = "jempty";
                    box.style.display = "grid";
                    box.style.gap = "0.4rem";
                    for (const line of [
                        "유실 원문 없음 — 지금 다시 처리할 것이 없습니다.",
                        "여기 쌓이는 것: 알림(X · YouTube)을 받았지만 반영하다 실패한 원문, 재시도 끝에 실패한 적용 작업. " +
                        "같은 원문이 텔레그램 DM 으로도 옵니다. 최대 50건, 넘치면 오래된 것부터 버립니다.",
                        "쌓이지 않는 것: 인증 실패(403)로 거절한 알림 — 원문을 받기 전에 거절하기 때문입니다. 작업 탭 최근 흐름에서 확인하세요.",
                        "쓰는 법: 항목을 체크하고 「선택 재투입」을 누르면 한 건씩 다시 처리하고, 성공한 건만 목록에서 빠집니다.",
                    ]) {
                        const p = document.createElement("div");
                        p.textContent = line;
                        box.appendChild(p);
                    }
                    container.appendChild(box);
                    return;
                }

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");
                for (const label of ["선택", "종류", "사유", "원문", "시각"]) {
                    const th = document.createElement("th");
                    th.textContent = label;
                    headerRow.appendChild(th);
                }
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");
                for (const item of data) {
                    const tr = document.createElement("tr");

                    const tdCheck = document.createElement("td");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = item.id;
                    checkbox.className = "lost-checkbox";
                    tdCheck.appendChild(checkbox);
                    tr.appendChild(tdCheck);

                    const kindLabel = { personal_tweet: "개인 트윗", notice: "소식", ingest: "업스트림 알림",
                                        apply_job: "적용 작업" }[item.kind] || item.kind || "—";
                    const tdKind = document.createElement("td");
                    tdKind.textContent = kindLabel +
                        (item.channel_key ? ` · ${(this.channels[item.channel_key] || {}).name_ko || item.channel_key}` : "") +
                        (item.job_kind ? ` · ${item.job_kind}` : "");
                    tr.appendChild(tdKind);

                    const tdReason = document.createElement("td");
                    tdReason.textContent = item.reason || "—";
                    const res = (this.lostResults || {})[item.ts];
                    if (res) {
                        const r = document.createElement("div");
                        r.className = "list-item-sub";
                        r.style.color = "#ff6b6b";
                        r.textContent = `재투입 실패: ${res}`;
                        tdReason.appendChild(r);
                    }
                    tr.appendChild(tdReason);

                    // 원문: 앞부분만 보이고 눌러서 전체 보기
                    const tdRaw = document.createElement("td");
                    tdRaw.style.fontSize = "0.85rem";
                    const det = document.createElement("details");
                    const sum = document.createElement("summary");
                    sum.textContent = (item.raw || "").substring(0, 60) || "(원문 없음)";
                    det.appendChild(sum);
                    const pre = document.createElement("pre");
                    pre.style.whiteSpace = "pre-wrap";
                    pre.textContent = item.raw || "";
                    det.appendChild(pre);
                    if (item.tweet_url) {
                        const a = document.createElement("div");
                        a.className = "list-item-sub";
                        a.textContent = item.tweet_url;
                        det.appendChild(a);
                    }
                    tdRaw.appendChild(det);
                    tr.appendChild(tdRaw);

                    const tdTime = document.createElement("td");
                    tdTime.textContent = this.formatTime(item.ts);
                    tr.appendChild(tdTime);

                    tbody.appendChild(tr);
                }
                table.appendChild(tbody);
                container.appendChild(table);

                const button = document.createElement("button");
                button.textContent = "선택 재투입";
                button.style.marginTop = "1rem";
                button.onclick = () => this.retryLost();
                container.appendChild(button);
            },

            async retryLost() {
                const checkboxes = document.querySelectorAll(".lost-checkbox:checked");
                const ids = Array.from(checkboxes).map((cb) => cb.value);

                if (ids.length === 0) {
                    this.showToast("선택된 항목이 없습니다", "error");
                    return;
                }

                if (!confirm(`유실 원문 ${ids.length}건을 한 건씩 다시 처리할까요?\n성공한 건만 목록에서 빠집니다.`)) return;

                try {
                    const result = await this.apiCall("POST", "/retry_lost", { ids });
                    const done = result.done || [];
                    const failed = result.failed || [];
                    this.showToast(`성공 ${done.length}건 · 실패 ${failed.length}건`, failed.length ? "error" : "success");
                    // 실패 사유를 남은 항목 옆에 표시. 목록 id 는 순번 기반이라 재조회 후 바뀌므로 원문 시각(ts)으로 맞춘다
                    this.lostResults = {};
                    for (const f of failed) this.lostResults[f.id.split(":").slice(1).join(":")] = f.error;
                    this.loadLost();
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            // ─────────────────────────────────────────────────────────────────────
            // 운영 탭
            // ─────────────────────────────────────────────────────────────────────

            async loadControl() {
                try {
                    const data = await this.apiCall("GET", "/get_control");
                    this.renderControl(data);
                } catch (e) {
                    console.error("운영 설정 로드 실패", e);
                }
            },

            // (v4a) 운영 탭 — 수집 · 반영(일시정지) / 텔레그램 알림 레벨 / 매일 멤버 현황 DM.
            // 설명 문구는 코드 기준: 일시정지 = handlers 정기 수집 · 방송 확인 + 공식 스케줄 · 개인 예고 반영 건너뜀
            // (소식 · 개인 트윗은 계속), 레벨별 종류 = notify._LEVEL_KINDS, 멤버 현황 = 매일 06:10 스냅샷 작업
            renderControl(data) {
                const container = document.getElementById("control-status");
                container.classList.remove("loading");
                container.textContent = "";
                const mk = (tag, cls, text) => {
                    const e = document.createElement(tag);
                    if (cls) e.className = cls;
                    if (text !== undefined) e.textContent = text;
                    return e;
                };
                const wrap = mk("div", "ctl");

                // ① 수집 · 반영
                const c1 = mk("section", "ctl-card");
                const h1 = mk("div", "ctl-head");
                const t1 = mk("div");
                t1.appendChild(mk("h3", "ctl-title", "수집 · 반영"));
                t1.appendChild(mk("p", "ctl-desc",
                    "일시정지하면 정기 수집(10분마다)과 방송 확인이 멈추고, 들어오는 공식 스케줄 · 개인 예고도 반영하지 않습니다. " +
                    "소식과 개인 트윗은 계속 반영됩니다. 재개하면 바로 수집을 한 번 돌립니다."));
                const st = mk("span", "ctl-status " + (data.paused ? "paused" : "on"), data.paused ? "일시정지됨" : "정상 운영 중");
                h1.append(t1, st);
                const a1 = mk("div", "ctl-actions");
                const b1 = mk("button", "ctl-btn " + (data.paused ? "resume" : "pause"), data.paused ? "재개" : "일시정지");
                b1.type = "button";
                b1.onclick = () => this.setPaused(!data.paused);
                a1.appendChild(b1);
                if (data.paused && data.since) a1.appendChild(mk("span", "ctl-meta", `${this.formatTime(data.since)}부터 정지`));
                c1.append(h1, a1);
                wrap.appendChild(c1);

                // ② 텔레그램 알림 레벨
                const c2 = mk("section", "ctl-card");
                const t2 = mk("div");
                t2.appendChild(mk("h3", "ctl-title", "텔레그램 알림 레벨"));
                t2.appendChild(mk("p", "ctl-desc", "상태 변화가 생겼을 때 로컬 봇이 DM 으로 보낼 종류를 정합니다. 고르면 바로 적용됩니다."));
                c2.appendChild(t2);
                const LV = [
                    { key: "simple", name: "간단", sum: "방송 시작 · 종료 위주",
                      kinds: ["예정 방송 확정", "방송 시작", "방송 종료"], add: [] },
                    { key: "normal", name: "보통", sum: "간단 + 새 예고 · 소식 · 트윗",
                      kinds: ["예정 방송 확정", "방송 시작", "방송 종료"], add: ["예고 등록", "소식", "개인 트윗"] },
                    { key: "detail", name: "자세히", sum: "보통 + 처리 과정 · 오류",
                      kinds: ["예정 방송 확정", "방송 시작", "방송 종료", "예고 등록", "소식", "개인 트윗"],
                      add: ["알림 수신 결과", "상태 되돌림", "오류", "요약"] },
                ];
                const cur = data.log_level || "normal";
                const grid = mk("div", "lv-grid");
                grid.setAttribute("role", "radiogroup");
                grid.setAttribute("aria-label", "알림 레벨");
                for (const lv of LV) {
                    const b = mk("button", "lv");
                    b.type = "button";
                    b.setAttribute("role", "radio");
                    b.setAttribute("aria-checked", String(lv.key === cur));
                    const nm = mk("div", "lv-name");
                    nm.appendChild(mk("span", "", lv.name));
                    if (lv.key === cur) nm.appendChild(mk("span", "lv-cur", "현재"));
                    const kinds = mk("div", "lv-kinds");
                    for (const k of lv.kinds) kinds.appendChild(mk("span", "", k));
                    for (const k of lv.add) kinds.appendChild(mk("span", "add", k));
                    b.append(nm, mk("div", "lv-sum", lv.sum), kinds);
                    b.onclick = () => { if (lv.key !== cur) this.setLogLevel(lv.key); };
                    grid.appendChild(b);
                }
                c2.appendChild(grid);
                wrap.appendChild(c2);

                // ③ 매일 멤버 현황 DM
                const c3 = mk("section", "ctl-card");
                const h3 = mk("div", "ctl-head");
                const t3 = mk("div");
                t3.appendChild(mk("h3", "ctl-title", "매일 멤버 현황 DM"));
                t3.appendChild(mk("p", "ctl-desc",
                    "매일 06:10(KST) 하루치 모니터링 스냅샷을 찍을 때 \"오늘의 멤버 현황\"을 텍스트 DM 으로 보냅니다. " +
                    "끄더라도 스냅샷은 그대로 찍혀 웹 모니터에 쓰입니다."));
                const sw = mk("button", "sw");
                sw.type = "button";
                sw.setAttribute("role", "switch");
                sw.setAttribute("aria-checked", String(!!data.monitor_auto));
                sw.append(mk("span", "sw-track"), mk("span", "", data.monitor_auto ? "켜짐" : "꺼짐"));
                sw.onclick = () => this.setMonitorAuto(!data.monitor_auto);
                h3.append(t3, sw);
                c3.appendChild(h3);
                wrap.appendChild(c3);

                if (data.updated_at) {
                    wrap.appendChild(mk("div", "ctl-meta",
                        `마지막 변경 ${this.formatTime(data.updated_at)}` + (data.by ? ` · ${data.by === "admin" ? "관리 페이지" : data.by}` : "")));
                }
                container.appendChild(wrap);
            },

            async setPaused(paused) {
                if (paused && !confirm("수집 · 반영을 일시정지할까요?\n\n정기 수집과 방송 확인이 멈추고, 공식 스케줄 · 개인 예고도 반영하지 않습니다.")) return;
                try {
                    const result = await this.apiCall("POST", "/set_paused", { paused });
                    if (result.ok) {
                        this.showToast(paused ? "일시정지했습니다" : "재개했습니다 — 수집을 한 번 돌립니다");
                        this.loadControl();
                    } else {
                        this.showToast(result.error || "설정 변경 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            async setLogLevel(level) {
                try {
                    const result = await this.apiCall("POST", "/set_log_level", { level });
                    if (result.ok) {
                        this.showToast("알림 레벨을 바꿨습니다");
                        this.loadControl();
                    } else {
                        this.showToast(result.error || "설정 변경 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            async setMonitorAuto(enabled) {
                try {
                    const result = await this.apiCall("POST", "/set_monitor_auto", { enabled });
                    if (result.ok) {
                        this.showToast(enabled ? "멤버 현황 DM 을 켰습니다" : "멤버 현황 DM 을 껐습니다");
                        this.loadControl();
                    } else {
                        this.showToast(result.error || "설정 변경 실패", "error");
                    }
                } catch (e) {
                    this.showToast(`오류: ${e.message}`, "error");
                }
            },

            // ─────────────────────────────────────────────────────────────────────
            // 모달 관리
            // ─────────────────────────────────────────────────────────────────────

            closeModal() {
                document.getElementById("edit-modal").classList.remove("active");
                this.editState = null;
            },
        };

        // 초기화
        document.addEventListener("DOMContentLoaded", () => app.init());
    </script>
</body>
</html>
