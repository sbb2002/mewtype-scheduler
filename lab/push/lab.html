<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알림 실험실 · 서버</title>
<style>
  /* 3단: 방송(상태 바꾸기) | 등록 현황 | 서버 기록 */
  :root { --bg:#f3f5f9; --panel:#fff; --fg:#1b2130; --muted:#5d6577; --line:#dde1ea; --accent:#3a5bd9; --live:#d93a3a; --ok:#1f8a4c; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11141b; --panel:#191d27; --fg:#e6e9f1; --muted:#9aa2b5; --line:#2b3040; --accent:#8099ff; --live:#ff6b6b; --ok:#5fd28f; --warn:#f0b24a; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { padding:14px 16px 0; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:baseline; }
  h1 { margin:0; font-size:17px; }
  .conf { color:var(--muted); }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.3fr); gap:12px; padding:12px 16px 16px; }
  @media (max-width: 1100px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; display:flex; flex-direction:column; gap:8px; }
  h2 { margin:0; font-size:14px; }
  .hint { margin:0; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button { font:inherit; padding:3px 8px; border-radius:5px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.go-live { border-color:var(--live); color:var(--live); }
  .items { display:flex; flex-direction:column; gap:6px; max-height:70vh; overflow:auto; }
  .item { border:1px solid var(--line); border-radius:6px; padding:6px 8px; display:grid; gap:4px; }
  .item .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; border:1px solid var(--line); }
  .pill.live { color:var(--live); border-color:var(--live); }
  .pill.upcoming, .pill.watching { color:var(--accent); border-color:var(--accent); }
  .pill.sent { color:var(--ok); border-color:var(--ok); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric:tabular-nums; }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
  .stat { border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .stat b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:11px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .log { max-height:60vh; overflow:auto; display:flex; flex-direction:column; }
  .log div { padding:2px 0; border-bottom:1px dashed var(--line); }
  .k-감지, .k-발송 { color:var(--live); } .k-반영 { color:var(--ok); } .k-요청 { color:var(--accent); } .k-실패, .k-정리 { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>알림 실험실 · 서버 쪽</h1>
  <span class="conf mono" id="conf"></span>
  <a href="/" target="_blank" rel="noopener">팬 화면 열기 ↗</a>
</header>
<main>
  <section>
    <h2>방송 (상태를 바꾸면 서버가 감지)</h2>
    <p class="hint">→ live 로 바꾸는 순간 등록자에게 발송합니다. 팬 화면은 75초마다 다시 읽으니, 새로 만든 방송의 종은 새로고침 후 보입니다.</p>
    <div class="row">
      <select id="newch" aria-label="멤버">
        <option value="arale">아라레</option><option value="yuno">유노</option><option value="nonoka">노노카</option>
        <option value="ritsu">리츠</option><option value="miyako">미야코</option>
      </select>
      <button id="newup" type="button">시험 예정 방송 만들기</button>
      <button id="newlive" type="button" class="go-live">시험 방송 바로 live</button>
      <button id="reset" type="button">보냄 기록 초기화</button>
    </div>
    <div class="items" id="items"></div>
  </section>

  <section>
    <h2>등록 현황</h2>
    <div class="stats" id="stats"></div>
    <p class="hint" id="pending"></p>
    <table><thead><tr><th>구독</th><th>멤버</th><th>영상</th><th>반영</th></tr></thead><tbody id="subs"></tbody></table>
    <p class="hint" id="fakes"></p>
    <h2>버스트 시험</h2>
    <div class="row">
      <button id="b1" type="button">curl 흉내: 한 구독 200번 연타</button>
      <button id="b3" type="button">10KB 요청</button>
      <button id="b5" type="button">가짜 구독 1500개 동시</button>
      <button id="b4" type="button">가짜 구독 지우기</button>
    </div>
    <p class="hint mono" id="bres"></p>
  </section>

  <section>
    <h2>서버 기록</h2>
    <div class="log mono" id="log"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const NAMES = { arale: "아라레", yuno: "유노", nonoka: "노노카", ritsu: "리츠", miyako: "미야코" };
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function renderItems(items, notified) {
  const box = $("items"); box.replaceChildren();
  for (const it of items) {
    const d = el("div", "item");
    const top = el("div", "row");
    top.append(el("span", `pill ${it.state}`, it.state), el("b", null, NAMES[it.channel_key] || it.channel_key || "?"),
               el("span", "mono", it.video_id || "(URL 없음)"));
    if (it.membership) top.append(el("span", "pill", "회원 전용"));
    if (notified.includes(it.video_id)) top.append(el("span", "pill sent", "보냄"));
    d.append(top, el("div", "t", it.title || ""));
    if (it.video_id) {
      const btns = el("div", "row");
      for (const s of ["upcoming", "watching", "live", "end"]) {
        const b = el("button", s === "live" ? "go-live" : "", `→ ${s}`);
        b.type = "button";
        b.onclick = () => post("/lab/item", { key: it.key, state: s }).then(refresh);
        btns.append(b);
      }
      d.append(btns);
    }
    box.append(d);
  }
}

function renderSubs(snap) {
  const real = snap.subs.filter((s) => !s.fake), fake = snap.subs.length - real.length;
  const tb = $("subs"); tb.replaceChildren();
  if (!real.length) { const tr = el("tr"); const td = el("td", "hint", "아직 없음 — 팬 화면에서 종을 눌러 보세요"); td.colSpan = 4; tr.append(td); tb.append(tr); }
  for (const s of real) {
    const tr = el("tr");
    tr.append(el("td", "mono", s.sid), el("td", null, s.members.map((m) => NAMES[m]).join(", ") || "—"),
              el("td", "mono", s.videos.join(", ") || "—"), el("td", "mono", s.updated || ""));
    tb.append(tr);
  }
  $("fakes").textContent = fake ? `가짜 구독(버스트 시험) ${fake}개 — 발송 대상에서 제외` : "";
  const o = snap.ops, used = (o.write || 0) + (o.delete || 0);
  $("pending").textContent = `저장소 연산(태평양 시간 ${snap.day}) — 읽기 ${o.read || 0} · 쓰기 ${o.write || 0} · 삭제 ${o.delete || 0}`
    + ` · 쓰기 상한 ${used}/${snap.conf.cap} (Firestore 무료: 읽기 5만 · 쓰기 2만 · 삭제 2만)`;
  const st = snap.stats, box = $("stats"); box.replaceChildren();
  for (const [k, label] of [["recv", "받은 요청(전부 202)"], ["written", "문서 씀"], ["deleted", "문서 삭제(해지)"],
                            ["same", "내용 같아 안 씀"], ["capped", "상한 넘어 안 씀"], ["bad", "형식 오류 버림"],
                            ["sent", "보낸 알림"]]) {
    const d = el("div", "stat"); d.append(el("b", null, String(st[k] || 0)), el("span", null, label)); box.append(d);
  }
}

function renderLog(lines) {
  const box = $("log"); box.replaceChildren();
  for (const l of lines) { const d = el("div", `k-${l.kind}`); d.textContent = `${l.t}  ${l.kind}  ${l.msg}`; box.append(d); }
}

async function refresh() {
  try {
    const snap = await (await fetch("/lab/api")).json();
    const c = snap.conf;
    $("conf").textContent = `응답은 늘 202 · 구독 1개 = 문서 1개(Firestore 흉내) · 하루 쓰기 상한 ${c.cap} · 요청 ${c.max_body}B 이하 · 연타는 프론트가 2초 묶음`;
    renderItems(snap.items, snap.notified); renderSubs(snap); renderLog(snap.log);
  } catch { /* 서버 재시작 중 */ }
}

function fakeSub(n) {
  return { endpoint: `https://fcm.googleapis.com/fcm/send/lab-fake-${n}`, keys: { p256dh: "B".repeat(87), auth: "A".repeat(22) } };
}
async function burst(label, reqs) {
  const t0 = performance.now();
  const res = await Promise.all(reqs.map((b) => fetch("/push/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: b }).then((r) => r.status, () => 0)));
  const count = res.reduce((m, s) => (m[s] = (m[s] || 0) + 1, m), {});
  $("bres").textContent = `${label}: ${Object.entries(count).map(([s, n]) => `${s}×${n}`).join(" · ")} (${Math.round(performance.now() - t0)}ms)`;
  refresh();
}
$("b1").onclick = () => burst("연타 200", Array.from({ length: 200 }, (_, i) =>
  JSON.stringify({ sub: fakeSub("tap"), members: i % 2 ? ["arale"] : [], videos: [] })));
$("b3").onclick = () => burst("10KB", [JSON.stringify({ sub: fakeSub("big"), members: [], videos: [], pad: "x".repeat(10240) })]);
$("b5").onclick = () => burst("동시 1500", Array.from({ length: 1500 }, (_, i) =>
  JSON.stringify({ sub: fakeSub(`flood-${Date.now()}-${i}`), members: ["nonoka"], videos: [] })));
$("b4").onclick = () => post("/lab/clearfake").then(refresh);
$("newup").onclick = () => post("/lab/new", { channel_key: $("newch").value, state: "upcoming" }).then(refresh);
$("newlive").onclick = () => post("/lab/new", { channel_key: $("newch").value, state: "live" }).then(refresh);
$("reset").onclick = () => post("/lab/reset").then(refresh);
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
