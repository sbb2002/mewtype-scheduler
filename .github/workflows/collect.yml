name: collect

# v2.0: 정기 수집은 Cloud Run이 담당하며 이 워크플로우는 수동 break-glass 전용이고 pending.json은 갱신하지 않는다.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - auto
          - light
          - deep
        default: auto

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
          fetch-depth: 1
        continue-on-error: true

      - run: mkdir -p _data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r src/collector/requirements.txt

      - name: decide mode
        id: m
        run: |
          IN="${{ github.event.inputs.mode }}"
          if [ -z "$IN" ] || [ "$IN" = "auto" ]; then
            # Deep-scan schedule keyed to JST (= UTC+9), where announcements cluster:
            #   JST 18:00-02:00 (announce peak): deep every hour -> JST 18,19,20,21,22,23,00,01
            #   JST 02:00-18:00 (daytime, quiet): deep at        -> JST 02,10,14  (JST 06 skipped)
            # = 11 deep scans/day (~5,500 units). Every other UTC hour still runs a
            #   cheap light sync (~2 units) so daytime RSS pickups aren't delayed.
            # 10#$(...) forces base-10 so "08"/"09" aren't parsed as octal.
            H=$(( 10#$(date -u +%H) ))
            case " 1 5 9 10 11 12 13 14 15 16 17 " in
              *" $H "*) echo "mode=deep"  >> "$GITHUB_OUTPUT" ;;
              *)        echo "mode=light" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "mode=$IN" >> "$GITHUB_OUTPUT"
          fi

      - name: collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATA_DIR: _data
        run: python -m src.collector.main ${{ steps.m.outputs.mode }}

      - name: commit
        working-directory: _data
        run: |
          git config user.name "mewtype-collector[bot]"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -d .git ]; then
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout -b data
          else
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: sync ${{ steps.m.outputs.mode }} $(date -u +%FT%TZ)"
          git branch -M data
          git push origin data
